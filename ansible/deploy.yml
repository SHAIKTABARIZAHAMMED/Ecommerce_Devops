- name: Copy Docker Compose
  copy:
    src: /home/Ecommerce_Devops/docker-compose.yml
    dest: /opt/ecommerce/docker-compose.yml

- name: Copy Nginx Config
  copy:
    src: /home/Ecommerce_Devops/nginx/default.conf
    dest: /opt/ecommerce/default.conf

- name: Copy Prometheus Config
  copy:
    src: /home/Ecommerce_Devops/monitoring/prometheus.yml
    dest: /opt/ecommerce/prometheus.yml

- name: Pull images
  shell: docker compose pull
  args:
    chdir: /opt/ecommerce

- name: Start containers
  shell: docker compose up -d
  args:
    chdir: /opt/ecommerce
