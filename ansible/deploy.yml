- name: Configure Ecommerce Server
  hosts: ecommerce
  become: yes

  tasks:

    - name: Install Docker
      dnf:
        name: docker
        state: present

    - name: Start Docker Service
      service:
        name: docker
        enabled: yes
        state: started

    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: yes

    - name: Install Docker Compose Plugin
      dnf:
        name: docker-compose-plugin
        state: present

    - name: Create application directory
      file:
        path: /opt/ecommerce
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'

    - name: Create nginx directory
      file:
        path: /opt/ecommerce/nginx
        state: directory
        owner: ec2-user
        group: ec2-user

    - name: Create monitoring directory
      file:
        path: /opt/ecommerce/monitoring
        state: directory
        owner: ec2-user
        group: ec2-user

    - name: Create postgres directory
      file:
        path: /opt/ecommerce/postgres
