services:

  postgres:
    image: postgres:15

    environment:
      POSTGRES_USER: ecommerce_user1
      POSTGRES_PASSWORD: ecommerce123
      POSTGRES_DB: ecommerce_database

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    image: shaiksdockerhub/backend:v1

    ports:
      - "5000:5000"

    depends_on:
      - postgres

  frontend:
    image: shaiksdockerhub/frontend:v1

    ports:
      - "5173:5173"

    depends_on:
      - backend

  nginx:
    image: nginx:latest

    ports:
      - "80:80"

    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - frontend
      - backend

  prometheus:
    image: prom/prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

volumes:
  postgres_data:
  - name: Copy Postgres Init File
    copy:
      src: /home/Ecommerce_Devops/postgres/init.sql
      dest: /opt/ecommerce/init.sql
  - name: Stop existing stack
    shell: docker compose down
    args:
      chdir: /opt/ecommerce
    ignore_errors: true

  - name: Pull images
    shell: docker compose pull
    args:
      chdir: /opt/ecommerce

  - name: Start stack
    shell: docker compose up -d
    args:
      chdir: /opt/ecommerce
