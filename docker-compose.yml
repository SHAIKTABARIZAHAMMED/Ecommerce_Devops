services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ecommerce_user1
      POSTGRES_PASSWORD: ecommerce123
      POSTGRES_DB: ecommerce_database
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    image: shaiksdockerhub/backend:v1
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  frontend:
    image: shaiksdockerhub/frontend:v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
  prometheus:
    image: prom/prometheus

    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana

    container_name: grafana

    ports:
      - "3000:3000"
